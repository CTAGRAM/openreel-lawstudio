  <body>
    <div id="root"></div>
  <script>
(function(){
  var m = new URLSearchParams(location.search).get('media');
  if(!m) return;
  var done=false, tries=0;
  function toast(t){ var d=document.getElementById('_ls_toast')||document.createElement('div'); d.id='_ls_toast'; d.textContent=t; d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#17171C;color:#fff;font:600 13px system-ui;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25)'; document.body.appendChild(d); }
  function findZone(){ var els=document.querySelectorAll('div,section,button'); for(var i=0;i<els.length;i++){var e=els[i]; if(/Drag files here|No media imported|click to import/i.test(e.textContent||'') && e.querySelectorAll('*').length<40) return e;} var inp=document.querySelector('input[type=file]'); return inp?inp.closest('div'):null; }
  async function go(){
    tries++; if(done) return;
    // dismiss onboarding
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    var zone=findZone();
    if(!zone){ if(tries<60) return setTimeout(go,500); return; }
    done=true; toast('Loading your video…');
    try{
      var blob=await (await fetch(m)).blob();
      var file=new File([blob],'render.mp4',{type:blob.type||'video/mp4'});
      var mk=function(t){var dt=new DataTransfer(); dt.items.add(file); var e=new DragEvent(t,{bubbles:true,cancelable:true}); Object.defineProperty(e,'dataTransfer',{value:dt}); return e;};
      ['dragenter','dragover','drop'].forEach(function(t){ zone.dispatchEvent(mk(t)); });
      setTimeout(function(){ toast('Video loaded — drag it onto the timeline to edit.'); setTimeout(function(){var d=document.getElementById('_ls_toast'); if(d) d.remove();},4000); },1500);
    }catch(err){ toast('Could not auto-load video — use Import.'); }
  }
  if(document.readyState!=='loading') setTimeout(go,1200); else document.addEventListener('DOMContentLoaded',function(){setTimeout(go,1200);});
})();
</script>
