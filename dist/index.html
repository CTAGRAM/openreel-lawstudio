  <body>
    <div id="root"></div>
  <script>
(function(){
  var m=new URLSearchParams(location.search).get('media'); if(!m) return;
  var done=false,tries=0;
  function toast(t){var d=document.getElementById('_ls_toast')||document.createElement('div');d.id='_ls_toast';d.textContent=t;d.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#17171C;color:#fff;font:600 13px system-ui;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25)';document.body.appendChild(d);}
  function reactOnChange(inp){var k=Object.keys(inp).find(function(x){return x.indexOf('__reactProps')===0;});return k&&inp[k]&&inp[k].onChange;}
  async function go(){
    if(done) return; tries++;
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    var inp=document.querySelector('input[type=file]');
    var oc=inp&&reactOnChange(inp);
    if(!oc){ if(tries<80) return setTimeout(go,400); return; }
    done=true; toast('Loading your video…');
    try{
      var blob=await (await fetch(m)).blob();
      var file=new File([blob],'render.mp4',{type:blob.type||'video/mp4'});
      var dt=new DataTransfer(); dt.items.add(file); inp.files=dt.files;
      oc({target:inp,currentTarget:inp,preventDefault:function(){},stopPropagation:function(){},nativeEvent:new Event('change')});
      setTimeout(function(){toast('Video loaded into Media — drag it onto the timeline to edit.');setTimeout(function(){var d=document.getElementById('_ls_toast');if(d)d.remove();},5000);},2500);
    }catch(e){ toast('Could not auto-load — use Import.'); }
  }
  if(document.readyState!=='loading') setTimeout(go,1500); else document.addEventListener('DOMContentLoaded',function(){setTimeout(go,1500);});
})();
</script>
